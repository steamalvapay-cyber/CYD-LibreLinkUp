[env:esp32dev]
; Fijada a la última 6.x (Arduino core 2.0.17): las 7.x/8.x usan el core 3, con el que TFT_eSPI da problemas.
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Más espacio para el firmware (3 MB, sin OTA). La zona NVS donde se guardan los
; ajustes sigue en la misma dirección, así que no se pierde la configuración.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
    tzapu/WiFiManager@^2.0.17

; These build_flags apply to EVERY file PlatformIO compiles, including
; TFT_eSPI's own library source files.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D TFT_INVERSION_ON
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD
    -D LOAD_GFXFF
    -D SMOOTH_FONT
